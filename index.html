<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnvSpeak</title>
  <style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  #micBtn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1px solid #30363d;
    background: #161b22;
    color:#ffb454;
    font-size: 22px;
    cursor: pointer;
  }
  #micBtn:hover {
    background: #21262d;
  }
  #textInput {
    background: #161b22;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    width: 250px !important;
  }
  #genBtn, #copyBtn, #downloadBtn {
    background: transparent;
    border: 1px solid #ffb454;
    color: #ffb454;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #genBtn:hover, #copyBtn:hover, #downloadBtn:hover {
    background: rgba(255,180,84,0.1);
  }
  #output {
    border: 1px solid #30363d;
    border-radius: 8px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #7ee787;
    padding: 14px !important;
  }
  #status {
    font-size: 13px;
  }
</style>
<link rel="icon" href="data:,">
</head>
<body>
  <h1>EnvSpeak</h1>

  <button id="micBtn">🎤</button>
  <span style="margin-left:10px;color:#8b949e;font-size:14px;">Speak your stack</span>
  </span>
  <input type="text" id="textInput" placeholder="or type your stack here" style="width:300px;">
  <button id="genBtn">Generate .env</button>
  <br><br>

  <pre id="output"></pre>
  <button id="copyBtn" style="display:none;">Copy</button>
  <button id="downloadBtn" style="display:none;">Download</button>

  <script>
    // ---- Stage 3.5: bigger dictionary + comments ----
    const SERVICES = {
      groq:      [["GROQ_API_KEY", "your_groq_api_key", "Groq API key"]],
      openai:    [["OPENAI_API_KEY", "sk-...", "OpenAI API key"]],
      postgres:  [["DATABASE_URL", "postgresql://user:pass@host:5432/dbname", "Postgres connection string"]],
      mongodb:   [["MONGODB_URI", "mongodb+srv://user:pass@cluster/dbname", "MongoDB connection string"]],
      firebase:  [["FIREBASE_API_KEY", "your_firebase_api_key", "Firebase Web API key"]],
      stripe:    [["STRIPE_SECRET_KEY", "sk_test_...", "Stripe secret key"]],
      netlify:   [["NETLIFY_AUTH_TOKEN", "your_netlify_token", "Netlify deploy token"]],
      twilio:    [["TWILIO_AUTH_TOKEN", "your_auth_token", "Twilio auth token"]],
      redis:     [["REDIS_URL", "redis://default:pass@host:6379", "Redis connection string"]],
      supabase:  [["SUPABASE_URL", "https://xxxx.supabase.co", "Supabase project URL"]],
    };

    function generateEnv(text) {
      const t = text.toLowerCase();
      let lines = [];
      for (const service in SERVICES) {
        if (t.includes(service)) {
          SERVICES[service].forEach(([key, placeholder, comment]) => {
            lines.push(`${key}=${placeholder}  # ${comment}`);
          });
        }
      }
      return lines;
    }

    function runGenerate(text) {
      const lines = generateEnv(text);
      const output = document.getElementById('output');
      const copyBtn = document.getElementById('copyBtn');
      const downloadBtn = document.getElementById('downloadBtn');

      if (lines.length === 0) {
        output.textContent = "No known services matched. Try: groq, postgres, mongodb, firebase, stripe, netlify, twilio, redis, supabase, openai";
        copyBtn.style.display = 'none';
        downloadBtn.style.display = 'none';
      } else {
        output.textContent = lines.join("\n");
        copyBtn.style.display = 'inline-block';
        downloadBtn.style.display = 'inline-block';
      }
    }

    document.getElementById('genBtn').addEventListener('click', () => {
      runGenerate(document.getElementById('textInput').value);
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('output').textContent);
      alert("Copied!");
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const text = document.getElementById('output').textContent;
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '.env.example';
      a.click();
      URL.revokeObjectURL(url);
    });

    // ---- mic code (unchanged) ----
    const micBtn = document.getElementById('micBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      micBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.interimResults = false;

      recognition.onstart = () => micBtn.textContent = "🎙️ Listening...";
      recognition.onend = () => micBtn.textContent = "🎤 Speak your stack";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('textInput').value = transcript;
        runGenerate(transcript);
      };

      recognition.onerror = (event) => {
        document.getElementById('output').textContent = "Mic error: " + event.error;
      };

      micBtn.addEventListener('click', () => recognition.start());
    }
  </script>
</body>
</html>
